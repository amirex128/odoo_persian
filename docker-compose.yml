services:
  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg18-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      # PostgreSQL 18+ requires the parent mount for major-version data dirs.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  odoo:
    image: odoo19-enterprise:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:-change-me-in-local-env}
      ODOO_LIST_DB: ${ODOO_LIST_DB:-True}
      ODOO_DB_FILTER: ${ODOO_DB_FILTER:-}
      ODOO_WORKERS: ${ODOO_WORKERS:-2}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-1}
      ODOO_LOG_LEVEL: ${ODOO_LOG_LEVEL:-warn}
    volumes:
      - odoo-data:/var/lib/odoo
      # Live external addons for local development.
      - ./addons:/mnt/extra-addons

volumes:
  postgres-data:
  odoo-data:
