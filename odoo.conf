[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Master Password برای مدیریت دیتابیس‌ها (حتماً تغییر دهید)
admin_passwd = YourStrongMasterPassword123

; csv_internal_sep = ,
; db_maxconn = 64
; db_name = False
; db_template = template1
; dbfilter = .*
; debug_mode = False
; email_from = False

; محدودیت حافظه (برای جلوگیری از کرش)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192

; محدودیت زمانی (افزایش داده شده برای ساخت دیتابیس با زبان فارسی)
limit_time_cpu = 600
limit_time_real = 1200

; list_db = True
; log_db = False
; log_handler = [':INFO']
; log_level = info
; logfile = None
; longpolling_port = 8072
; max_cron_threads = 2
; osv_memory_age_limit = 1.0
; osv_memory_count_limit = False
; smtp_password = False
; smtp_port = 25
; smtp_server = localhost
; smtp_ssl = False
; smtp_user = False

; workers = 0   (اگر می‌خواهید multiprocess فعال شود، عدد بیشتر از ۰ بگذارید)
; xmlrpc = True
; xmlrpc_interface =
; xmlrpc_port = 8069
; xmlrpcs = True
; xmlrpcs_interface =
; xmlrpcs_port = 8071

; فعال کردن proxy_mode برای سرویس‌های PaaS
proxy_mode = True