[options]
; Non-secret defaults. The official Odoo image entrypoint injects
; db_host/db_port/db_user/db_password from HOST, PORT, USER and PASSWORD.
admin_passwd = __ODOO_ADMIN_PASSWD__
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True
list_db = __ODOO_LIST_DB__
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
workers = __ODOO_WORKERS__
max_cron_threads = __ODOO_MAX_CRON_THREADS__
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192